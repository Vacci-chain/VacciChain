<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <rect width="800" height="220" fill="#ffffff"/>
  <rect x="20" y="20" width="160" height="50" rx="8" fill="#e6f2ff" stroke="#003366"/>
  <text x="100" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#003366">Frontend (React)</text>

  <rect x="220" y="20" width="160" height="50" rx="8" fill="#e6ffe6" stroke="#006600"/>
  <text x="300" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#006600">Backend (Express)</text>

  <rect x="420" y="20" width="160" height="50" rx="8" fill="#fff0e6" stroke="#994d00"/>
  <text x="500" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#994d00">Python Service</text>

  <rect x="620" y="20" width="160" height="50" rx="8" fill="#f0e6ff" stroke="#660099"/>
  <text x="700" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#660099">Soroban Contract</text>

  <line x1="180" y1="45" x2="220" y2="45" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="45" x2="420" y2="45" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="45" x2="620" y2="45" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444" />
    </marker>
  </defs>

  <rect x="20" y="120" width="160" height="50" rx="8" fill="#ffe6f0" stroke="#990033"/>
  <text x="100" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#990033">Freighter / Wallets</text>

  <rect x="220" y="120" width="160" height="50" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="300" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Stellar Network (Horizon)</text>

  <line x1="100" y1="70" x2="100" y2="120" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="300" y1="70" x2="300" y2="120" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="700" y1="70" x2="300" y2="145" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

</svg>
